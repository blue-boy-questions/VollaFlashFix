plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mmggh.vollaflashfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.mmggh.vollaflashfix"
        minSdk 33
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    // Fixed signing key committed to the repo so every CI build produces an
    // APK with the SAME signature. This lets you install updates over a
    // previous version without uninstalling first. This is a throwaway
    // distribution key for a personal tool, not a security-sensitive secret.
    signingConfigs {
        release {
            storeFile file('vollaflashfix.keystore')
            storePassword 'android'
            keyAlias 'vollakey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
